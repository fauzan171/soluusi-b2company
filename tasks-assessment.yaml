test_cmd: "/usr/local/bin/php vendor/bin/phpunit > /tmp/t.log 2>&1; tail -5 /tmp/t.log | tr -d '\\033'"

constraints:
  - Workers NEVER touch repo_prod, never push, never deploy, never migrate:fresh on a non-test DB.
  - Each worker = own git worktree under ../wt/soluusi-b2b-<task-id>, branch feat/<task-id>-<slug> off the A1 commit.
  - TDD: failing test first, then code. Tests use fake data only (no real names/emails/phones).
  - Healthcare data: no PII/scores in logs, commits, fixtures. HR never sees individual results.
  - Match existing style: Indonesian UI copy + comments, English identifiers/commits, Blade + Tailwind.
  - Migrations idempotent (hasTable/hasColumn guards), MySQL+SQLite safe; update W1RollbackCheckTest step count.
  - Ignore stderr lines containing "safelock" / "userdatadomains" (host noise).
  - Smallest diff. No new composer/npm dependencies.

# ---------------------------------------------------------------------------
# BUSINESS DECISIONS (mandor, final — derived from the Doc; workers do not re-decide)
# ---------------------------------------------------------------------------
decisions:
  D1_who_assigns: >
    Superadmin/Operations (roles admin, operations) assign instruments. HR and
    employees never choose instruments. Doc §3A "Program Activation / Assessment
    Management" + role table (Operations = pelaksanaan program).
  D2_one_mechanism: >
    One table `assessment_assignments` serves Perusahaan and Sekolah (polymorphic
    assignable: program | perusahaan | sekolah). Employee/student dashboard shows
    ONLY assigned instruments (+ per-person clinical grants). Fixes today's bugs:
    Big Five/DISC always visible, Ergonomic never visible, no-program = everything visible.
  D3_core_per_package: |
    Core instruments are auto-created by the program wizard (source=core):
      discovery  : 1 instrument, admin picks WHO-5 (default) or DASS-21. MH only.
                   (Doc conflict "MH/Nutrition" vs "Satu Mental Health Assessment" +
                   placement table "WHO-5 atau DASS-21" -> 2 of 3 mentions = MH only.)
      foundation : admin picks domain MH or Nutrition (radio, required).
                   MH -> DASS-21; Nutrition -> Nutrition Assessment.
                   assessment_domains snapshot = [chosen domain] (fixes hardcoded ['mh']).
      growth     : DASS-21 + Nutrition Assessment.
      impact     : DASS-21 + Nutrition Assessment.
    Optional "included in MH domain" extras (no charge, source=core): WHO-5, PSS-10
    — only when the program has domain mh.
  D4_addons: >
    Everything not core and not clinical is an add-on (source=addon), assignable per
    company with addon_price (Rp, excl. tax, required >= 0): bigfive, disc, ergonomic,
    phq9, gad7, cbi ("instrumen lain sesuai tujuan"). Add-ons appear on Program Order
    as line items and in the order total. Doc §4 "Add-on: Berbayar/terpisah".
  D5_clinical: >
    MCMI-III is NEVER assignable to a company/school (Doc: tidak boleh massal). Stays
    per-employee InstrumentGrant; grant now requires `reason` (indikasi klinis, max 500).
  D6_rounds_and_windows: |
    Each assignment has a window (opens_at..closes_at) and a round number.
    One submission per (assignment, person) — DB unique index, no retake inside a window.
    Rounds give Doc §5C "Wellbeing Progress" (— / — / Basic / Advanced):
      discovery, foundation : 1 round = whole program period.
      growth                : 2 rounds — R1 starts_at..+29d (baseline), R2 ends_at-29d..ends_at.
      impact                : 4 rounds — Rn opens starts_at + 3*(n-1) months, closes +29d
                              (aligned with the 4 quarterly reviews already generated).
      add-ons               : 1 round = whole program period.
    Admin may edit window, close early, or add a round.
  D7_trend: >
    Trend comparison (HR) only for growth (R1 vs R2) and impact (R1..R4), only when
    every compared round has n >= 10 completers; always render the Doc §5C disclaimer:
    "Perbedaan skor antarperiode tidak otomatis menunjukkan bahwa program menyebabkan perubahan."
  D8_legacy_parity: >
    Existing prod data (2 companies without active program, 83 WHO-5 rows; 2 schools,
    35 WHO-5 rows) must keep working: migration backfills a `source=legacy` WHO-5
    assignment per perusahaan (assignable=perusahaan) and per sekolah (audiences
    student + staff), open-ended. Precedence: active program assignments override
    perusahaan-level legacy ones. Legacy WHO-5 path EmployeeController::assessmentStore
    (NULL instrument_code bug) is removed; its routes redirect to the new list.
  D9_sekolah_safety: >
    Students (minors) may only receive: who5, pss10, bigfive, disc. Symptom/clinical
    instruments (dass21, phq9, gad7, cbi, mcmi3) are blocked for audience=student until
    a safeguarding flow exists (PHQ-9 item 9). Sekolah staff (adults) may receive any
    non-clinical instrument. Sekolah aggregate threshold stays n >= 5; company n >= 10.
  D10_hr_view: >
    HR sees per assignment: completion = distinct completers / registered employees
    (counts always visible — not health data), band distribution only when
    AggregatePrivacy::safe(n,10), restricted to instruments assigned to their program.
    Never names, never individual scores.
  D11_reminders: >
    Company only (v1): creating an assignment schedules 2 EngagementCampaign rows
    (kind=reminder): invite at opens_at, reminder at closes_at-3d (if closes_at set and
    window >= 7 days). Sender skips employees who already submitted for that assignment.
  D12_terms: >
    S&K version tracking: config('terms.perusahaan_version') / ('terms.klinik_version'),
    stored on registration (terms_version). Perusahaan registration adds required
    "Jabatan" (registrant_position, max 100) per S&K Perusahaan §19.
  D13_not_doing: >
    Parent portal, safeguarding flow, consultant specialty matching for Foundation
    domain, custom quote >1000 employees (already errors to Finance), Klinik S&K
    §16.2 placeholder (legal text — owner must decide).

# ---------------------------------------------------------------------------
# SCHEMA (A1 implements exactly this)
# ---------------------------------------------------------------------------
schema:
  assessment_assignments:
    id: bigIncrements
    assignable_type: "string(32)  # morph map: program=CompanyWellbeingProgram, perusahaan=Perusahaan, sekolah=Sekolah"
    assignable_id: unsignedBigInteger
    instrument_code: "string(32), index"
    audience: "string(16) default 'employee'  # employee | student | staff"
    source: "string(16)  # core | addon | legacy"
    addon_price: "decimal(14,2) nullable  # only source=addon"
    round: "unsignedSmallInteger default 1"
    opens_at: date
    closes_at: "date nullable  # null = open-ended (legacy)"
    status: "string(16) default 'active'  # active | closed"
    assigned_by: "foreignId users nullable, nullOnDelete"
    timestamps: true
    unique: [assignable_type, assignable_id, instrument_code, audience, round]
    index: [assignable_type, assignable_id, status]
  perusahaan_assessments_add:
    assessment_assignment_id: "foreignId nullable, nullOnDelete"
    unique: "[assessment_assignment_id, employee_id]  # NULLs allowed for old rows"
  sekolah_assessments_add:
    instrument_code: "string(32) nullable -> backfill 'who5'"
    escalated: "boolean default false"
    assessment_assignment_id: "foreignId nullable, nullOnDelete"
    unique: "[assessment_assignment_id, student_id]"
  instrument_grants_add:
    reason: "string(500) nullable"
  engagement_campaigns_add:
    assessment_assignment_id: "foreignId nullable, nullOnDelete"
  perusahaans_add: { registrant_position: "string(100) nullable", terms_version: "string(20) nullable" }
  kliniks_add: { terms_version: "string(20) nullable" }

