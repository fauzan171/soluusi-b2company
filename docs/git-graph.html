const g = document.getElementById('g');
function render(list){
  g.innerHTML = list.map(c=>\`<div class="row">
    <span class="dot \${c.on_main?'hot':''}"></span>
    <span class="hash">\${c.h}</span>
    <div><div class="msg">\${(c.ref?'<span class="ref \${c.on_main?'live':''}">\${c.ref}</span>':'')}\${c.msg}</div>
    <div class="meta">\${c.author} · \${c.when}</div></div>
  </div>\`).join('');
}
render(data);
document.getElementById('search').addEventListener('input',e=>{

});
